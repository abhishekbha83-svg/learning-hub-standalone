      </text>
      <g transform="translate(0, 50)">
        <line x1="-280" y1="-8" x2="-200" y2="-8" stroke="#34d399" stroke-width="3.5" stroke-linecap="round" />
        <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Montserrat', sans-serif" font-weight="800" font-size="22" letter-spacing="9" fill="#e2e8f0">
          LEARN BEYOND LIMITS
        </text>
        <line x1="200" y1="-8" x2="280" y2="-8" stroke="#34d399" stroke-width="3.5" stroke-linecap="round" />
      </g>
    </g>

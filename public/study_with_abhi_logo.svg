        <path d="M -2 -10 C -25 -22, -52 -20, -70 -8 L -70 20 C -52 8, -25 10, -2 22 Z" fill="url(#cyanEmeraldGrad)" opacity="0.85" />
        <path d="M 2 -15 C 25 -28, 55 -25, 75 -12 L 75 25 C 55 12, 25 15, 2 28 Z" fill="#ffffff" filter="url(#softGlow)" opacity="0.95" />
        <path d="M 2 -10 C 25 -22, 52 -20, 70 -8 L 70 20 C 52 8, 25 10, 2 22 Z" fill="url(#cyanEmeraldGrad)" opacity="0.85" />
        <path d="M 0 -18 L 0 30" stroke="#10b981" stroke-width="4" stroke-linecap="round" />
      </g>
      <path d="M -240 60 C -260 -10, -160 -90, -10 -10 C 130 65, 240 10, 200 -70 C 180 -95, 120 -110, 50 -80 C 110 -60, 170 -40, 175 -15 C 180 25, 90 40, -40 -15 C -150 -65, -230 -20, -200 40 Z" fill="url(#swooshGrad)" filter="url(#neonGlow)" />
      <g transform="translate(205, -75) scale(1.3)" filter="url(#softGlow)">

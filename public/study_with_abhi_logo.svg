      </text>
      <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Orbitron', 'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="78" letter-spacing="12" fill="none" stroke="url(#cyanEmeraldGrad)" stroke-width="2">

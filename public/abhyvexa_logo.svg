<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradients -->
    <radialGradient id="abhyGlowBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0a1f1a" />
      <stop offset="50%" stop-color="#061210" />
      <stop offset="100%" stop-color="#040608" />
    </radialGradient>

    <!-- Neon Cyan & Emerald Ring Gradients -->
    <linearGradient id="neonBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5c4" />
      <stop offset="45%" stop-color="#00e5a3" />
      <stop offset="70%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <linearGradient id="orbitGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5c4" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#00d296" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="leftBladeGrad" x1="20%" y1="10%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="35%" stop-color="#34d399" />
      <stop offset="70%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <linearGradient id="rightBladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#e2e8f0" />
      <stop offset="70%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="vexaTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#00f5c4" />
    </linearGradient>

    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Glow Filter for Emblem Elements -->
    <filter id="neonSoftGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="neonIntenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle & Background -->
  <rect x="15" y="15" width="470" height="470" rx="95" ry="95" fill="#040608" />
  <rect x="18" y="18" width="464" height="464" rx="92" ry="92" fill="url(#abhyGlowBg)" />

  <!-- Outer Neon Glowing Border -->
  <rect x="20" y="20" width="460" height="460" rx="90" ry="90" fill="none" stroke="url(#neonBorderGrad)" stroke-width="3" filter="url(#neonSoftGlow)" opacity="0.9" />
  <!-- Corner Bright Highlights -->
  <circle cx="110" cy="22" r="3" fill="#ffffff" filter="url(#neonSoftGlow)" />
  <circle cx="390" cy="22" r="3" fill="#ffffff" filter="url(#neonSoftGlow)" />
  <circle cx="22" cy="250" r="3.5" fill="#00f5c4" filter="url(#neonSoftGlow)" />
  <circle cx="478" cy="250" r="3.5" fill="#00f5c4" filter="url(#neonSoftGlow)" />
  <circle cx="250" cy="478" r="3" fill="#00f5c4" filter="url(#neonSoftGlow)" />

  <!-- Background Ambience Glow behind Logo Apex -->
  <circle cx="250" cy="210" r="140" fill="#00f5c4" opacity="0.08" filter="blur(35px)" />
  <circle cx="380" cy="140" r="60" fill="#38bdf8" opacity="0.12" filter="blur(25px)" />

  <!-- 1. The Futuristic Orbital Ring (Passes behind the Apex) -->
  <g id="orbitalBack">
    <ellipse cx="255" cy="195" rx="145" ry="55" transform="rotate(-24 255 195)" fill="none" stroke="url(#orbitGrad)" stroke-width="9" stroke-linecap="round" opacity="0.45" />
  </g>

  <!-- 2. The Main Emblem: Stylized Futuristic 'A' -->
  <g id="mainA">
    <!-- Left Curved Sweeping Blade -->
    <path d="M 248 85 C 248 85, 235 120, 200 190 C 170 248, 115 315, 115 315 C 135 318, 175 305, 205 270 C 220 252, 245 180, 248 160 Z" fill="url(#leftBladeGrad)" />

    <!-- Swooping 3D Ribbon Wrap extending from left leg over the front -->
    <path d="M 100 270 C 95 230, 140 185, 200 170 C 265 152, 330 195, 345 220 C 315 208, 250 185, 190 205 C 145 220, 110 250, 100 270 Z" fill="url(#orbitGrad)" filter="url(#neonSoftGlow)" />

    <!-- Right Sharp Precision Blade / Wedge -->
    <path d="M 250 80 L 385 315 L 340 315 L 282 205 L 246 130 Z" fill="url(#rightBladeGrad)" />

    <!-- Central Apex Shading -->
    <path d="M 247 80 L 253 80 L 278 185 L 240 185 Z" fill="#ffffff" opacity="0.25" />

    <!-- 3. Open Book Icon in Lower Core of 'A' -->
    <g id="glowingBook" transform="translate(250, 280)">
      <!-- Book Glow Ambient -->
      <circle cx="0" cy="5" r="30" fill="#00f5c4" opacity="0.25" filter="blur(10px)" />
      
      <!-- Book Base Frame -->
      <path d="M -5 18 C -25 8, -50 8, -58 14 C -56 5, -30 2, -5 8 Z" fill="#00e5a3" opacity="0.7" />
      <path d="M 5 18 C 25 8, 50 8, 58 14 C 56 5, 30 2, 5 8 Z" fill="#00e5a3" opacity="0.7" />

      <!-- Left Page -->
      <path d="M -4 4 C -22 -6, -46 -6, -56 2 C -54 18, -26 12, -4 20 Z" fill="#ffffff" />
      <!-- Left Page Inset Shade -->
      <path d="M -8 6 C -22 -2, -40 -2, -48 4 C -46 14, -26 10, -8 16 Z" fill="#e2e8f0" opacity="0.4" />

      <!-- Right Page -->
      <path d="M 4 4 C 22 -6, 46 -6, 56 2 C 54 18, 26 12, 4 20 Z" fill="#ffffff" />
      <!-- Right Page Inset Shade -->
      <path d="M 8 6 C 22 -2, 40 -2, 48 4 C 46 14, 26 10, 8 16 Z" fill="#a7f3d0" opacity="0.5" />

      <!-- Spine Center Line -->
      <path d="M 0 4 L 0 22" stroke="#00f5c4" stroke-width="2.5" stroke-linecap="round" />
    </g>
  </g>

  <!-- 4. Front Foreground of Orbital Ring & Upper-Right Star -->
  <g id="orbitalFront">
    <!-- Star Sparkle at Top-Right (X: 382, Y: 140) -->
    <g transform="translate(382, 140)">
      <!-- 4-point Radiant Star -->
      <path d="M 0 -22 C 1 -7, 7 -1, 22 0 C 7 1, 1 7, 0 22 C -1 7, -7 1, -22 0 C -7 -1, -1 -7, 0 -22 Z" fill="#ffffff" filter="url(#neonSoftGlow)" />
      <circle cx="0" cy="0" r="4" fill="#a7f3d0" />
    </g>
  </g>

  <!-- 5. Typography: "ABHYVEXA" -->
  <g id="abhyvexaText" transform="translate(250, 385)">
    <!-- Custom angular futuristic rendering of ABHYVEXA -->
    <!-- "ABHY" in polished silver white -->
    <text x="-215" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" fill="url(#silverGrad)" letter-spacing="4">
      ABHY
    </text>
    <!-- "VEXA" in glowing neon teal/emerald -->
    <text x="32" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" fill="url(#vexaTextGrad)" letter-spacing="4" filter="url(#neonSoftGlow)">
      VEXA
    </text>
  </g>

  <!-- 6. Tagline: "— LEARN BEYOND LIMITS —" -->
  <g id="tagline" transform="translate(250, 422)">
    <!-- Left Divider Line -->
    <line x1="-195" y1="-5" x2="-145" y2="-5" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
    
    <!-- Tagline Text -->
    <text x="0" y="0" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14.5" fill="#f1f5f9" letter-spacing="5">
      LEARN BEYOND LIMITS
    </text>

    <!-- Right Divider Line -->
    <line x1="145" y1="-5" x2="195" y2="-5" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  </g>
</svg>
